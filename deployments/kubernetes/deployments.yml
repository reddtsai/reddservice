apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: reddservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: gateway
          image: reddtsai/reddservice-gateway:v0.0.5
          ports:
            - containerPort: 80
          env:
            - name: HTTP_PORT
              value: "80"
            - name: CONFIG_PATH
              value: "conf.d"
          volumeMounts:
            - name: config-volume
              mountPath: /app/conf.d/config.yaml
              subPath: config.yml
      volumes:
        - name: config-volume
          configMap:
            name: gateway-configmap

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: reddservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: auth
          image: reddtsai/reddservice-auth:v0.0.5
          ports:
            - containerPort: 80
            - containerPort: 50051
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "80"
            - name: CONFIG_PATH
              value: "conf.d"
          volumeMounts:
            - name: config-volume
              mountPath: /app/conf.d/config.yaml
              subPath: config.yml
          livenessProbe:
            httpGet:
              path: /_/healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_/readyz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: auth-configmap

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: reddservice
  name: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgpool
  template:
    metadata:
      labels:
        app: pgpool
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: pgpool
          image: pgpool/pgpool
          env:
            - name: POSTGRES_USERNAME
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "1qaz2wsx"
            - name: PGPOOL_ENABLE_POOL_PASSWD
              value: "true"
            - name: PGPOOL_SKIP_PASSWORD_ENCRYPTION
              value: "false"
          volumeMounts:
            - name: pgpool-config-volume
              mountPath: /config
      volumes:
        - name: pgpool-config-volume
          configMap:
            name: pgpool-configmap
